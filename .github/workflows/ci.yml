name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --group dev --extra cursor

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (critical path)
        run: uv run mypy src/repo_vendor/naming.py src/repo_vendor/spec.py src/repo_vendor/workflow.py

      - name: Pytest + coverage gate
        run: uv run pytest
