additional_context: '### What is Application Load Balancer (ALB)?

  - An AWS Elastic Load Balancing service that distributes incoming application traffic
  across multiple targets (e.g., EC2 instances) in multiple Availability Zones.

  - Operates at the application layer (HTTP/HTTPS), supporting path-based routing,
  host-based routing, and advanced request routing via listener rules.

  - Core components: load balancer, listeners (protocol/port + rules), and target
  groups (registered targets + health checks).

  - Primary use: improve application availability and scalability by load balancing
  web traffic and routing requests to healthy backend targets.

  - Platform: aws

  - Docs: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html'
