additional_context: '### What is Azure Private Link?

  - Azure Private Link enables access to Azure PaaS services (Storage, SQL Database,
  etc.) and customer/partner services over a private endpoint in your virtual network.

  - Traffic between your VNet and the service travels the Microsoft backbone network,
  so exposing services to the public internet is not required.

  - Teams provision Private Link for secure private connectivity, data-exfiltration
  protection, and to expose their own services via Private Link Service behind a Standard
  Load Balancer.

  - Platform: azure

  - Docs: https://learn.microsoft.com/azure/private-link/private-link-overview'
