additional_context: '### What is VPC Endpoints?

  - VPC endpoints let resources in your VPC connect to AWS services (or other VPC-hosted
  services) using private IP addresses instead of the public internet.

  - **Interface endpoints** (AWS PrivateLink) create ENIs in your subnets and route
  traffic to supported AWS services without an internet gateway or NAT device.

  - **Gateway endpoints** provide free, route-table-based private access to Amazon
  S3 and DynamoDB (no PrivateLink ENIs).

  - Teams provision VPC endpoints to keep traffic on the AWS network, meet security/compliance
  requirements, and reduce NAT/IGW exposure for workloads in private subnets.

  - Platform: **aws**

  - Docs: https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-access-aws-services.html'
