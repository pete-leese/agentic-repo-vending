additional_context: "### What is AWS Private CA?\n- AWS Private Certificate Authority\
  \ (ACM PCA) lets you create and manage private certificate authority (CA) hierarchies\u2014\
  root and subordinate CAs\u2014without operating an on-premises CA.\n- Private CAs\
  \ issue end-entity X.509 certificates for encrypted TLS channels, user/device/API\
  \ authentication, code signing, and OCSP-based revocation.\n- Accessible via AWS\
  \ Console, AWS Private CA API, and AWS CLI; integrates with ACM and services like\
  \ EKS for in-cluster certificate issuance.\n- Platform: aws\n- Docs: https://docs.aws.amazon.com/privateca/latest/userguide/PcaWelcome.html"
