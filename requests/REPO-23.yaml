additional_context: '### What is AWS PrivateLink?

  - AWS PrivateLink is a highly available, scalable technology that lets you privately
  connect your VPC to AWS services, resources, and third-party services as if they
  were inside your VPC.

  - Primary use: create interface VPC endpoints so workloads in private subnets can
  reach services without internet gateways, NAT devices, public IPs, Direct Connect,
  or VPN.

  - Teams provision PrivateLink to control which API endpoints and services are reachable
  from a VPC, expose their own VPC endpoint services to other accounts, and enable
  private SaaS/Marketplace connectivity.

  - Supports interface endpoints (AWS services, cross-account endpoint services, partner
  services), resource endpoints, and service-network endpoints.

  - Platform: aws

  - Docs: https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html'
