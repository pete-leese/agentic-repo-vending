additional_context: '### What is Network Load Balancer (NLB)?

  - AWS Elastic Load Balancing service that operates at Layer 4 (TCP/UDP/QUIC) of
  the OSI model, routing traffic to registered targets in target groups.

  - Primary use: high-throughput, low-latency load balancing for TCP/UDP workloads
  (e.g. microservices, containers, VPC endpoints) where connection-level routing and
  static IPs per AZ are needed.

  - Handles millions of requests per second; supports cross-zone load balancing, health
  checks, TLS termination, and target types including instances, IPs, and ALBs.

  - Teams provision NLBs to distribute traffic across EC2, ECS, EKS, or IP targets
  with predictable performance and fault tolerance across Availability Zones.

  - Platform: aws

  - Docs: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html'
