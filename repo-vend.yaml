# Project config for agentic-repo-vending (env vars still override secrets / local .env).
# Customize board URLs, Keyword Approval phrases, templates, and status/label names here.
# Docs: docs/customizing.md

jira:
  # Board humans use (documentation + doctor output)
  board_url: "https://agentic-workflow-demo.atlassian.net/jira/software/projects/REPO/boards/2"
  base_url: "https://agentic-workflow-demo.atlassian.net"
  statuses:
    new_request: "New Request"
    processing: "In Progress"
    done: "Done"
  labels:
    proposed: "repo-vend-proposed"
    vended: "repo-vended"
    success: "repo-vend-success"
    warning: "repo-vend-warning"
    error: "repo-vend-error"
  approval:
    # Comment phrases that approve a proposal (case-insensitive). "+1" is supported.
    keywords:
      - approved
      - lgtm
      - looks good
      - ship it
      - "+1"

github:
  owner: pete-leese
  control_plane_repo: agentic-repo-vending
  templates:
    terraform: template-terraform-repo
    python: template-python-repo
    generic: template-generic-repo
  # When ticket type is unclear, fall back to this project type / template key
  default_project_type: generic

models:
  # Dual-model policy: orchestrator ≠ eval (see docs/adr/0002).
  # claude-sonnet-5 → propose/extract (stronger ticket understanding; Other Models pool).
  # composer-2.5 → eval judge (Cursor Models pool; independent of orchestrator).
  # Override locally: ORCHESTRATOR_MODEL / EVAL_MODEL. List IDs: Cursor.models.list().
  orchestrator: claude-sonnet-5
  eval: composer-2.5

# Cloud Agent MCP enrichment (propose). The CLI never calls these APIs — it only
# consumes IssueSnapshot.additional_context and freezes it on the Spec Request.
# See docs/automation-setup.md and docs/customizing.md.
cloud_docs:
  enabled: true
  max_chars: 4000
  # When Automation leaves additional_context empty, propose fetches a short
  # AWS docs overview via the public search API (fail-open). Prefer MCP when available.
  cli_fallback: true
  # Prefill / Automation: enable these MCP servers on the Cloud Agent / Automation.
  # Catalog names must match cursor.com/agents or Dashboard → Integrations & MCP.
  providers:
    aws:
      enabled: true
      mcp_server: "awslabs.aws-documentation-mcp-server"
      # Stdio example (dashboard JSON): uvx awslabs.aws-documentation-mcp-server@latest
      notes: "AWS Documentation MCP — service facts for terraform modules on aws"
    azure:
      enabled: true
      mcp_server: "azure-mcp-server"
      # Stdio example: npx -y @azure/mcp@latest server start
      notes: "Azure MCP Server — service/platform facts for terraform modules on azure"
    gcp:
      enabled: false
      # Optional: Google Developer Knowledge (HTTP) or gcloud MCP when enabled for the team
      mcp_server: ""
      notes: "Enable when a GCP docs MCP is available to the Cloud Agent"
